name: release

# Every push to main is a new version, the commit count (make version), so
# each one tests that commit and publishes it as release v<version>, tag
# included, as tide for Chrome's does. Install from it with a clone of the
# tag and install/tide-setup (README.md). Running it by hand tests and
# prints the version, without a release.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The version is the commit count, so it needs all of them.
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - id: version
        run: echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"
      # Only a push to main publishes. A re-run of one whose version is
      # already released publishes nothing; --exit-code makes ls-remote exit 2
      # when no such tag exists yet.
      - id: release
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if test "$EVENT" != push; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          case "$status" in
            0)
              echo "v$VERSION is already released"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::couldn't check for tag v$VERSION (git ls-remote exited $status)"
              exit 1
              ;;
          esac
      - run: make lint test
        env:
          TIDE_NEED_NODE: "1"
      # gh creates the tag at this commit when it doesn't exist yet. A tag
      # made with this token starts no workflow, so nothing runs twice.
      - if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "tide for macOS $VERSION" --generate-notes
