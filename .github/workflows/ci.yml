name: ci

on:
  pull_request:
    # `edited` so a retarget re-runs `lanes` against the new base.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Sorts the diff into the code or docs lane (.github/lanes.conf; the
  # engine is mikelward/lanes). Pushes to main are always code.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  test:
    runs-on: ubuntu-24.04
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The tide for Linux and tide for Chrome commits copied here (make
      # sync), so a change there can't turn a pull request here red;
      # upstream.yml says when they've moved on.
      - id: upstream
        run: |
          echo "tide=$(awk '$1 == "tide" { print $2 }' UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "tideco=$(awk '$1 == "tideco" { print $2 }' UPSTREAM)" >> "$GITHUB_OUTPUT"
      # tide's geometry, clocks, startup and clipboard modules are copied here unchanged; check
      # they still match, and that the defaults restated here are still tide's.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tide
          ref: ${{ steps.upstream.outputs.tide }}
          path: tide
          persist-credentials: false
      # So are the dashboard's clock modules and the dashboard launcher's page
      # from tideco.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tideco
          ref: ${{ steps.upstream.outputs.tideco }}
          path: tideco
          persist-credentials: false
      # Ubuntu packages Lua 5.4, which is what Hammerspoon embeds.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      # The runner's Node runs the dashboard page test, which mustn't skip.
      - run: make lint test
        env:
          TIDE_NEED_NODE: "1"
      - run: make check-tide TIDE=tide
      - run: make check-tideco TIDECO=tideco
  # A smoke test in a real Hammerspoon: every hs.* name tide uses exists,
  # tide starts and opens its dashboard, and it tiles three windows. The
  # runner comes with Accessibility granted; tests/ covers the rest.
  hammerspoon:
    runs-on: macos-15
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # conf's Karabiner rules, which tide turns on, beside tide's own:
      # Karabiner-Elements' own checker, as they are and as tide copies
      # them for its modifier swap.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/conf
          path: conf
          persist-credentials: false
      - run: ci/karabiner-lint.sh conf
        env:
          GH_TOKEN: ${{ github.token }}
      - run: brew install --cask hammerspoon
      - run: ci/hs-smoke.sh

  # tide's installer, for real, on a fresh Mac: Homebrew, the apps, the
  # keys it frees, Karabiner's rule, and a second run that changes nothing.
  install:
    runs-on: macos-15
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ci/install-check.sh

  # The one check to require: it passes when every heavy job passed, or when
  # the diff rode the docs lane and they skipped.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test, hammerspoon, install]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
            hammerspoon=${{ needs.hammerspoon.result }}
            install=${{ needs.install.result }}
