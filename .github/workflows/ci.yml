name: ci

on:
  pull_request:
    # `edited` so a retarget re-runs `lanes` against the new base.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Sorts the diff into the code or docs lane (.github/lanes.conf; the
  # engine is mikelward/lanes). Pushes to main are always code.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  test:
    runs-on: ubuntu-24.04
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # tide's geometry, clocks, startup and clipboard modules are copied here unchanged; check
      # they still match.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tide
          path: tide
          persist-credentials: false
      # So are the dashboard's clock modules and the dashboard launcher's page
      # from tideco.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tideco
          path: tideco
          persist-credentials: false
      # Ubuntu packages Lua 5.4, which is what Hammerspoon embeds.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      # The runner's Node runs the dashboard page test, which mustn't skip.
      - run: make lint test
        env:
          TILEMO_NEED_NODE: "1"
      - run: make check-tide TIDE=tide
      - run: make check-tideco TIDECO=tideco
  # A smoke test in a real Hammerspoon: every hs.* name tilemo uses exists,
  # tilemo starts and opens its dashboard, and it tiles three windows. The
  # runner comes with Accessibility granted; tests/ covers the rest.
  hammerspoon:
    runs-on: macos-15
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install --cask hammerspoon
      - run: ci/hs-smoke.sh

  # The one check to require: it passes when every heavy job passed, or when
  # the diff rode the docs lane and they skipped.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test, hammerspoon]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
            hammerspoon=${{ needs.hammerspoon.result }}
